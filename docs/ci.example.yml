name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-and-verify-zip:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 1. Run Hermetic Unit & MCP Protocol Tests
        run: python tests/test_codex_bridge.py
      - name: 2. Validate Manifest, Privacy Scan & Build Release ZIP
        run: python scripts/build_release.py
      - name: 3. Unpack Actual Release ZIP & Verify Pass / Fail / Skip Install Paths
        run: python tests/test_release_zip.py
