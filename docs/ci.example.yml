name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Hermetic Unit & MCP Integration Tests
        run: python tests/test_codex_bridge.py
      - name: Validate Manifest, Privacy Scan & Build Release Archive
        run: python scripts/build_release.py
